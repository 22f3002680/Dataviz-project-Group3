name: Publish dashboard to gh-pages

on:
  push:
    branches:
      - project-materials
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish dashboard folder
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dashboard/. /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll

          cd /tmp/gh-pages
          git add -A

          if git diff --cached --quiet; then
            echo "No dashboard changes to publish."
          else
            git commit -m "Deploy dashboard from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
