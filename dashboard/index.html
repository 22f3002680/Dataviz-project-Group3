<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Commerce Satisfaction Dashboard</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">DVD Project</p>
          <h1>E-Commerce Satisfaction Dashboard</h1>
          <p class="subhead">Marketplace growth, delivery reliability, and customer experience signals.</p>
        </div>
        <nav class="tabs" aria-label="Dashboard sections">
          <button class="tab active" data-view="overview" type="button">Overview</button>
          <button class="tab" data-view="delivery" type="button">Delivery</button>
          <button class="tab" data-view="categories" type="button">Categories</button>
          <button class="tab" data-view="regions" type="button">Regions</button>
          <button class="tab" data-view="sellers" type="button">Sellers</button>
          <button class="tab" data-view="growth" type="button">Growth</button>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Goal</p>
            <h2>Grow the marketplace without breaking customer experience</h2>
          </div>
          <div class="badge">GitHub Pages build</div>
        </header>

        <section class="kpis" id="kpis"></section>
        <section id="view-root"></section>
      </main>
    </div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
